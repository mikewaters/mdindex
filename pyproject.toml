[project]
name = "mdindex"
version = "1.0.0"
description = "Python Markdown Search - Hybrid search engine for markdown documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Mike", email = "mike@example.com"},
]
license = {text = "MIT"}

dependencies = [
    "pmd",
    "idx",
    "llama-index-core>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "tach>=0.33.0",
    "respx>=0.22.0",
    "pytest-testmon>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.workspace]
members = ["src/*"]

[tool.uv.sources]
pmd = { workspace = true }
idx = { workspace = true }

# Shared tool config across the workspace
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
#addopts = "--testmon" #--cov=src/pmd --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow",
    "requires_llm: tests requiring LLM provider",
]

[tool.coverage.run]
source = ["src/pmd", "src/idx", "app"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

