[project]
name = "mdindex"
version = "1.0.0"
description = "Python Markdown Search - Hybrid search engine for markdown documents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Mike", email = "mike@example.com"},
]
license = {text = "MIT"}

dependencies = [
    #"pmd",
    "idx",
    "llama-index-readers-obsidian",
    "llama-index-embeddings-huggingface>=0.6.1",
    "mlx-embeddings>=0.0.5",
    "llama-index-vector-stores-duckdb>=0.5.1",
    "llama-index-storage-docstore-duckdb>=0.2.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.24",
    "pytest-cov",
    "mypy",
    "ruff",
    "tach",
    "respx",
    "pytest-testmon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.workspace]
members = ["src/idx"]

[tool.uv.sources]
#pmd = { workspace = true }
idx = { workspace = true }
#llama-index-readers-obsidian = { workspace = true }


# Shared tool config across the workspace
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--ignore=tests/idx/scenario --ignore=tests/pmd" #--testmon #--cov=src/pmd --cov-report=term-missing --cov-report=html"
markers = [
    "slow: marks tests as slow",
    "requires_llm: tests requiring LLM provider",
]

[tool.coverage.run]
source = ["src/idx", "app"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"



