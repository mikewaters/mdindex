[project]
name = "idx"
version = "0.1.0"
description = "Index library for markdown document search using LlamaIndex"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "llama-index>=0.12.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idx"]
