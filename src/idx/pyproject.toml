[project]
name = "idx"
version = "0.1.0"
description = "Index library for markdown document search using LlamaIndex"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "llama-index>=0.12.0",
    "loguru>=0.7.0",
    "sqlalchemy>=2.0",
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-huggingface>=0.6.1",
]

#[build-system]
#requires = ["hatchling"]
#build-backend = "hatchling.build"
#
#[tool.hatch.build.targets.wheel]
#packages = ["idx"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Flat layout: pyproject.toml is co-located with package files in src/pmd/
# Tell setuptools to find packages in parent (src/) directory
[tool.setuptools]
package-dir = {"" = ".."}

[tool.setuptools.packages.find]
where = [".."]
include = ["pmd*"]